name: Relato de bug
description: Reporte um problema no CapivaraOS instalado, na ISO ou no build.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de continuar, confira se já não existe uma issue parecida e se
        não se trata de uma vulnerabilidade de segurança (nesse caso, veja
        `SECURITY.md` em vez de abrir uma issue pública).

        Você **não precisa** saber construir a ISO para reportar um problema.
        Preencha só o que fizer sentido para o seu caso.
  - type: dropdown
    id: kind
    attributes:
      label: Onde o problema acontece?
      options:
        - Usando o CapivaraOS já instalado
        - Instalando a partir da ISO (ou testando ao vivo)
        - Construindo a ISO eu mesmo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: O que aconteceu? O que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: O passo a passo que leva ao problema. Se for no build, inclua os comandos executados.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do CapivaraOS
      description: "Veja em Configurações do Sistema → Sobre este Sistema. Se estiver construindo a ISO, informe também o commit deste repositório."
      placeholder: "CapivaraOS Marsh 1.1.3"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Máquina
      description: Modelo do computador, ou se é uma máquina virtual. Ajuda muito em problemas de boot, vídeo, som, rede e impressão.
      placeholder: "Dell Inspiron 15 3520 / VM QEMU"
  - type: input
    id: build_environment
    attributes:
      label: Ambiente de build
      description: Só preencha se você estiver construindo a própria ISO — versão do Fedora na máquina de build e arquitetura.
      placeholder: "Fedora 44 x86_64"
  - type: textarea
    id: logs
    attributes:
      label: Logs ou fotos da tela
      description: |
        Cole trechos de log em bloco de código, ou anexe fotos se o problema for
        visual ou acontecer durante o boot. Para problemas no build, use os logs
        do `livemedia-creator`, do build do RPM ou do `%post`.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmação
      options:
        - label: Confirmo que isso não é um relato de vulnerabilidade de segurança.
          required: true
